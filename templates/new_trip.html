{% extends "base.html" %}
{% block title %}New Trip — Travel Planner{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h4>Create a New Trip</h4>
  <form method="post">
    <div class="mb-3">
      <label for="destination" class="form-label">Destination</label>
      <input type="text" id="destination" name="destination" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="title" class="form-label">Trip Title (optional)</label>
      <input type="text" id="title" name="title" class="form-control">
    </div>
    <div class="mb-3">
      <label for="start_date" class="form-label">Start Date</label>
      <input type="date" id="start_date" name="start_date" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="end_date" class="form-label">End Date</label>
      <input type="date" id="end_date" name="end_date" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="travelers" class="form-label">Number of Travelers</label>
      <input type="number" id="travelers" name="travelers" class="form-control" value="1" min="1">
    </div>
    <div class="mb-3">
      <label for="budget_preference" class="form-label">Budget Preference</label>
      <select id="budget_preference" name="budget_preference" class="form-control">
        <option value="budget">Budget</option>
        <option value="medium" selected>Medium</option>
        <option value="luxury">Luxury</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Create Trip</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
